name: ML Model CD

# Chaine de livraison continue DU MODELE CO2 (competence C13).
# Distincte de la CI applicative (backend-ci-cd.yml, frontend-ci.yml) :
# elle ne se declenche que sur le code de la chaine ML et sur les donnees.

on:
  push:
    branches: [main]
    paths:
      - "ml/**"
      - "data/**"
      - ".github/workflows/ml-model-cd.yml"
  pull_request:
    paths:
      - "ml/**"
      - "data/**"
      - ".github/workflows/ml-model-cd.yml"
  workflow_dispatch:
    inputs:
      seed:
        description: "Graine aleatoire d'entrainement"
        required: false
        default: "42"
        type: string
      r2_min:
        description: "Seuil R2 minimal (surcharge ml/thresholds.yaml)"
        required: false
        default: "0.75"
        type: string
  schedule:
    # Reentrainement periodique : tous les lundis a 03h00 UTC
    - cron: "0 3 * * 1"

env:
  PYTHON_VERSION: "3.14"
  DATA_PATH: data/dataset_final.csv
  CONFIG_PATH: ml/thresholds.yaml
  MODEL_DIR: ml/artifacts
  REPORT_DIR: ml/reports
  REGISTRY: ghcr.io
  IMAGE_NAME: mspr3-backend

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # 1. Validation des donnees
  # -------------------------------------------------------------------------
  data-validation:
    name: 1. Validation des donnees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dependances ML
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Valider le jeu de donnees
        run: |
          python ml/data/validate_data.py \
            --data "$DATA_PATH" \
            --config "$CONFIG_PATH" \
            --report "$REPORT_DIR/data_validation.json"

      - name: Publier le rapport de validation des donnees
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-report
          path: ${{ env.REPORT_DIR }}/data_validation.json
          if-no-files-found: warn

  # -------------------------------------------------------------------------
  # 2. Entrainement
  # -------------------------------------------------------------------------
  train:
    name: 2. Entrainement du modele
    runs-on: ubuntu-latest
    needs: data-validation
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dependances ML
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Entrainer le modele
        env:
          SEED: ${{ github.event.inputs.seed || '42' }}
        run: |
          python ml/train.py \
            --data "$DATA_PATH" \
            --config "$CONFIG_PATH" \
            --out-dir "$MODEL_DIR" \
            --seed "$SEED"

      - name: Publier les artefacts du modele
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            ${{ env.MODEL_DIR }}/model_final.joblib
            ${{ env.MODEL_DIR }}/scaler.joblib
            ${{ env.MODEL_DIR }}/features.joblib
            ${{ env.MODEL_DIR }}/test_set.csv
            ${{ env.MODEL_DIR }}/metadata.json
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 3. Validation du modele (porte de qualite)
  # -------------------------------------------------------------------------
  evaluate:
    name: 3. Validation du modele
    runs-on: ubuntu-latest
    needs: train
    outputs:
      model_version: ${{ steps.version.outputs.model_version }}
      r2: ${{ steps.version.outputs.r2 }}
      verdict: ${{ steps.version.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dependances ML
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Recuperer les artefacts du modele
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: ${{ env.MODEL_DIR }}

      - name: Evaluer le modele et appliquer la porte de qualite
        env:
          R2_MIN: ${{ github.event.inputs.r2_min || '' }}
        run: |
          EXTRA=""
          if [ -n "$R2_MIN" ]; then EXTRA="--r2-min $R2_MIN"; fi
          python ml/evaluate.py \
            --model-dir "$MODEL_DIR" \
            --config "$CONFIG_PATH" \
            --champion ml/champion/evaluation.json \
            --report-dir "$REPORT_DIR" $EXTRA

      - name: Extraire la version et les metriques
        id: version
        if: always()
        run: |
          VERSION=$(python -c "import json;print(json.load(open('$MODEL_DIR/metadata.json'))['model_version'])")
          echo "model_version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -f "$REPORT_DIR/evaluation.json" ]; then
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          d = json.load(open(os.environ["REPORT_DIR"] + "/evaluation.json"))
          print(f"r2={d['metrics']['r2']:.4f}")
          print(f"verdict={d['verdict']}")
          PY
          fi

      - name: Publier le rapport d'evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            ${{ env.REPORT_DIR }}/evaluation.json
            ${{ env.REPORT_DIR }}/evaluation.md
          if-no-files-found: warn

      - name: Ajouter le rapport au resume de l'execution
        if: always()
        run: |
          if [ -f "$REPORT_DIR/evaluation.md" ]; then
            cat "$REPORT_DIR/evaluation.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  # -------------------------------------------------------------------------
  # 4. Tests du modele
  # -------------------------------------------------------------------------
  model-tests:
    name: 4. Tests du modele
    runs-on: ubuntu-latest
    needs: evaluate
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dependances ML
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Recuperer les artefacts du modele
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: ${{ env.MODEL_DIR }}

      - name: Executer les tests du modele
        env:
          MODEL_DIR: ${{ env.MODEL_DIR }}
          ML_CONFIG: ${{ env.CONFIG_PATH }}
        run: python -m pytest ml/tests/test_model.py -v

  # -------------------------------------------------------------------------
  # 5. Empaquetage
  # -------------------------------------------------------------------------
  package:
    name: 5. Empaquetage de l'image
    runs-on: ubuntu-latest
    needs: [evaluate, model-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Recuperer les artefacts du modele
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: ${{ env.MODEL_DIR }}

      - name: Integrer le modele valide dans le contexte de build
        run: |
          cp "$MODEL_DIR/model_final.joblib" backend/app/services/ia/model_final.joblib
          cp "$MODEL_DIR/scaler.joblib"      backend/app/services/ia/scaler.joblib
          echo "Modele valide integre dans le contexte de build (runner uniquement)."

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.evaluate.outputs.model_version }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verifier que l'image contient bien le modele
        run: |
          docker run --rm --entrypoint sh \
            "${IMAGE_NAME}:${{ needs.evaluate.outputs.model_version }}" \
            -c "ls -l app/services/ia/"

  # -------------------------------------------------------------------------
  # 6. Publication
  # -------------------------------------------------------------------------
  publish:
    name: 6. Publication et rapport
    runs-on: ubuntu-latest
    needs: [evaluate, package]
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Recuperer les artefacts du modele
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: ${{ env.MODEL_DIR }}

      - name: Recuperer le rapport d'evaluation
        uses: actions/download-artifact@v4
        with:
          name: evaluation-report
          path: ${{ env.REPORT_DIR }}

      - name: Integrer le modele valide dans le contexte de build
        run: |
          cp "$MODEL_DIR/model_final.joblib" backend/app/services/ia/model_final.joblib
          cp "$MODEL_DIR/scaler.joblib"      backend/app/services/ia/scaler.joblib

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authentification au registre
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image sur GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.evaluate.outputs.model_version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commenter le rapport d'evaluation sur la pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.REPORT_DIR}/evaluation.md`;
            if (!fs.existsSync(path)) {
              core.warning("Rapport d'evaluation absent, aucun commentaire publie.");
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Recapitulatif de livraison
        run: |
          {
            echo "## Livraison du modele"
            echo ""
            echo "| Element | Valeur |"
            echo "| :------ | :----- |"
            echo "| Version du modele | ${{ needs.evaluate.outputs.model_version }} |"
            echo "| R2 mesure | ${{ needs.evaluate.outputs.r2 }} |"
            echo "| Verdict | ${{ needs.evaluate.outputs.verdict }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Declencheur | ${{ github.event_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"
