name: frontend-ci

# Deplace depuis frontend/.github/workflows/ le 08/09/2026 : GitHub Actions ne
# lit que .github/workflows/ a la racine du depot. A son ancien emplacement,
# ce workflow n'etait jamais execute.
# Les commandes s'executent dans frontend/ (defaults.run.working-directory) ;
# le filtre paths evite de relancer la CI frontend sur un changement backend.

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Recupere le repo
        uses: actions/checkout@v4
      
      - name: Installe pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Installe Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml


      - name: Install toutes les dependances du projet
        run: pnpm install --frozen-lockfile

      - name: Installe Playwright avec ses dependances
        run: pnpm exec playwright install --with-deps

      - name: Lance ESLint
        run: pnpm lint

      - name: Test E2E
        run: pnpm test:e2e --update-snapshots

      - name: Build
        run: pnpm build